                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              resourceManagement:
                description: |-
                  ResourceManagement conveys resource-management intent for these pods; the reconciler
                  translates it into companion VerticalPodAutoscaler/ScaledObject objects. Never touches the
                  Deployment/StatefulSet spec itself.
                properties:
                  autoScaling:
                    description: AutoScaling expresses horizontal scaling intent,
                      translated to a KEDA ScaledObject.
                    properties:
                      maxReplicas:
                        format: int32
                        minimum: 1
                        type: integer
                      minReplicas:
                        format: int32
                        minimum: 0
                        type: integer
                      monitoringDomain:
                        description: MonitoringDomain selects which Thanos endpoint
                          this trigger queries.
                        enum:
                        - App
                        - Istio
                        - Platform
                        type: string
                      query:
                        description: Query is the PromQL query evaluated against the
                          resolved MonitoringDomain endpoint.
                        type: string
                      threshold:
                        description: |-
                          Threshold is the value at which KEDA scales up, mirroring the native Prometheus scaler's
                          own field.
                        type: string
                    required:
                    - maxReplicas
                    - minReplicas
                    - monitoringDomain
                    - query
                    - threshold
                    type: object
                  rightSizing:
                    description: RightSizing expresses vertical sizing intent, translated
                      to a VerticalPodAutoscaler.
                    properties:
                      maxCPU:
                        description: MaxCPU is the upper bound VPA may recommend for
                          this container, e.g. "500m".
                        type: string
                      maxMemory:
                        description: MaxMemory is the upper bound VPA may recommend
                          for this container, e.g. "512Mi".
                        type: string
                      minCPU:
                        description: |-
                          MinCPU is an optional lower bound VPA may recommend for this container, e.g. "50m". Must
                          be <= MaxCPU if set.
                        type: string
                      minMemory:
                        description: |-
                          MinMemory is an optional lower bound VPA may recommend for this container, e.g. "64Mi".
                          Must be <= MaxMemory if set.
                        type: string
                      mode:
                        description: |-
                          Mode: SetOnce sizes the pod once at creation and never touches it again (VPA "Initial").
                          Continuous actively keeps it right-sized over time, restarting the pod when a better size
                          is found (VPA "Recreate").
                        enum:
                        - SetOnce
                        - Continuous
                        type: string
                    required:
                    - maxCPU
                    - maxMemory
                    - mode
                    type: object
                  targetRef:
                    description: |-
                      TargetRef identifies the Deployment/StatefulSet that owns these pods. Required if
                      RightSizing or AutoScaling is set.
                    properties:
                      kind:
                        enum:
                        - Deployment
                        - StatefulSet
                        type: string
                      name:
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                type: object
            type: object
          status:
