    schema:
      openAPIV3Schema:
        description: WorkloadClass is the Schema for the workloadclasses API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of WorkloadClass
            properties:
              computeClass:
                description: |-
                  ComputeClass names a ComputeClass object that pods matched by this WorkloadClass should be
                  scheduled onto. Translated into the same nodeSelector/toleration convention used by the
                  platform's existing compute-class scheduling, composing with the safe-to-evict suspend/
                  restore behavior above. Left unset, pods are scheduled with no compute-class preference.
                type: string
              disruptionPolicy:
                description: DisruptionPolicy specifies the policy governing pod disruptions.
                properties:
                  allowedDisruptionWindows:
                    description: AllowedDisruptionWindows defines when disruptions
                      are allowed.
                    items:
                      description: DisruptionWindow defines a temporal window when
                        disruptions are allowed.
                      properties:
                        daysOfWeek:
                          description: DaysOfWeek specifies the days of the week (Monday-Sunday).
                          items:
                            type: string
                          type: array
                        endTime:
                          description: EndTime is the end time of the window in HH:MM
                            format (e.g. 04:00) in UTC.
                          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        name:
                          description: Name is the name of the DisruptionWindow.
                          type: string
                        startTime:
                          description: StartTime is the start time of the window in
                            HH:MM format (e.g. 22:00) in UTC.
                          pattern: ^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$
                          type: string
                        timeZone:
                          description: TimeZone is the IANA Time Zone Database name
                            (e.g., "America/Los_Angeles", "Etc/UTC"). See https://www.iana.org/time-zones.
                          pattern: ^[A-Za-z_]+/[A-Za-z_]+$
